name: "🔧 Dev Task"
description: "Create a new development task"
title: "[DEV] "
labels: ["dev-task"]
body:
  - type: textarea
    id: background
    attributes:
      label: "Background & Objective"
      description: "Why is this task needed? What is the expected outcome?"
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: "Technical Approach"
      description: "Brief description of the implementation plan. Link to external design docs if available."

  - type: textarea
    id: scope
    attributes:
      label: "Scope & Impact"
      description: "Which contracts/modules are affected? Any impact on already deployed contracts?"

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - P0-Critical
        - P1-High
        - P2-Medium
        - P3-Low
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: "Estimated Effort"
      options:
        - "S (< 1 day)"
        - "M (1-3 days)"
        - "L (3-5 days)"
        - "XL (> 5 days)"
    validations:
      required: true

  - type: input
    id: partner
    attributes:
      label: "Related Partner / Protocol"
      description: "If this task involves an external partner, specify here."
      placeholder: "e.g. XX Protocol"

  - type: textarea
    id: checklist
    attributes:
      label: "Acceptance Criteria"
      description: "What conditions must be met for this task to be considered done?"
      value: |
        - [ ] Contract code implemented
        - [ ] Unit tests passing
        - [ ] Integration tests passing
        - [ ] Security audit passed
        - [ ] Deployed to testnet and verified
        - [ ] Deployed to mainnet

  - type: textarea
    id: references
    attributes:
      label: "References"
      description: "Links to related PRs, docs, discussions, or external resources."